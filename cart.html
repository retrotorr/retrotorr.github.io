<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - RetroTorr</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sfc-red: #e52521;
            --dark-text: #e0e0e0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4a4a4a 0%, #3a3a3a 50%, #2e2e2e 100%);
            color: var(--dark-text);
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.03) 3px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.03) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.03) 3px);
            pointer-events: none;
            z-index: 1;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(229, 37, 33, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(229, 37, 33, 0.08) 0%, transparent 50%);
            z-index: 0;
            animation: subtleMove 20s ease-in-out infinite;
        }

        @keyframes subtleMove {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.8; }
        }

        /* Header */
        header {
            padding: 1.5rem 5%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 4px solid var(--sfc-red);
            box-shadow: 0 8px 32px rgba(229, 37, 33, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--sfc-red);
            letter-spacing: -0.5px;
            text-transform: uppercase;
            position: relative;
            padding-left: 1rem;
            text-decoration: none;
        }

        .logo::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 70%;
            background: var(--sfc-red);
            border-radius: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--dark-text);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover {
            color: var(--sfc-red);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--sfc-red);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .cart-count.hidden {
            display: none;
        }

        /* Main Cart Container */
        .cart-container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 5%;
            position: relative;
            z-index: 2;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .cart-title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--dark-text);
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }

        .cart-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--sfc-red);
        }

        /* Empty Cart */
        #emptyCart {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 4px solid var(--sfc-red);
            box-shadow: 0 8px 32px rgba(229, 37, 33, 0.15);
        }

        #emptyCart h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--dark-text);
        }

        #emptyCart p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .continue-shopping {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--sfc-red);
            color: white;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(229, 37, 33, 0.3);
        }

        .continue-shopping:hover {
            background: #c01a16;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(229, 37, 33, 0.4);
        }

        /* Cart Items */
        .cart-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        .cart-items {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 4px solid var(--sfc-red);
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(229, 37, 33, 0.15);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .cart-item-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--dark-text);
        }

        .cart-item-price {
            font-size: 1.1rem;
            color: var(--sfc-red);
            font-weight: 700;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.5rem;
            border-radius: 4px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: var(--sfc-red);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: #c01a16;
            transform: scale(1.1);
        }

        .quantity {
            min-width: 30px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .cart-item-subtotal {
            font-size: 1.2rem;
            font-weight: 700;
            min-width: 80px;
            text-align: right;
        }

        .remove-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 2px solid rgba(229, 37, 33, 0.5);
            color: var(--sfc-red);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .remove-btn:hover {
            background: var(--sfc-red);
            color: white;
            border-color: var(--sfc-red);
        }

        /* Cart Summary */
        .cart-summary {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 4px solid var(--sfc-red);
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(229, 37, 33, 0.15);
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .cart-summary h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--dark-text);
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .summary-line.total {
            font-size: 1.5rem;
            font-weight: 900;
            padding-top: 1rem;
            border-top: 2px solid rgba(229, 37, 33, 0.3);
            margin-top: 1rem;
            color: var(--sfc-red);
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--sfc-red);
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(229, 37, 33, 0.3);
        }

        .checkout-btn:hover {
            background: #c01a16;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(229, 37, 33, 0.4);
        }

        .clear-cart-btn {
            width: 100%;
            padding: 0.8rem;
            background: transparent;
            color: var(--dark-text);
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .clear-cart-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--sfc-red);
            color: var(--sfc-red);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .cart-item-controls {
                width: 100%;
                justify-content: space-between;
            }

            .cart-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">RETROTORR</a>
            <ul class="nav-links">
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        Cart
                        <span class="cart-count hidden" id="cartCount">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Shopping Cart</h1>
        </div>

        <!-- Empty Cart Message -->
        <div id="emptyCart" style="display: none;">
            <h2>Your cart is empty</h2>
            <p>Looks like you haven't added any items to your cart yet.</p>
            <a href="index.html#products" class="continue-shopping">Continue Shopping</a>
        </div>

        <!-- Cart Content -->
        <div class="cart-content" id="cartContent">
            <div class="cart-items">
                <div id="cartItems">
                    <!-- Cart items will be dynamically inserted here -->
                </div>
            </div>

            <div class="cart-summary" id="cartSummary">
                <h2>Order Summary</h2>
                <div class="summary-line">
                    <span>Subtotal:</span>
                    <span id="subtotalAmount">$0.00</span>
                </div>
                <div class="summary-line">
                    <span>Tax (8%):</span>
                    <span id="taxAmount">$0.00</span>
                </div>
                <div class="summary-line total">
                    <span>Total:</span>
                    <span id="totalAmount">$0.00</span>
                </div>
                <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
                <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        // Display cart on page load
        window.addEventListener('DOMContentLoaded', () => {
            displayCart();
            updateCartCount();
        });

        // Proceed to checkout (you'll integrate Stripe here)
        function proceedToCheckout() {
            const cart = getCart();
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            
            // TODO: Integrate with Stripe here
            alert('Checkout functionality will be integrated with Stripe. Cart total: $' + getCartTotal().toFixed(2));
            
            // For now, redirect to a checkout page (you'll create this with Stripe)
            // window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
